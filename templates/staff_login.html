<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purewash Staff — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',system-ui,sans-serif;}
  body{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:linear-gradient(160deg,#163455,#0e3140);color:#163455;}
  .card{background:#fff;border-radius:22px;padding:40px 34px;width:100%;max-width:380px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.5);text-align:center;}
  .logo{width:60px;height:60px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;
    background:linear-gradient(150deg,#0c7c78,#10a08e);}
  .logo svg{width:32px;height:32px;color:#fff;}
  h1{font-size:1.3rem;color:#163455;} p.sub{color:#6d8494;font-size:.86rem;margin:6px 0 24px;}
  input{width:100%;padding:14px;border:1.5px solid #e6eef1;border-radius:12px;font-size:1rem;margin-bottom:14px;}
  input:focus{outline:none;border-color:#12a594;}
  button{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0c7c78,#10a08e);}
  .err{color:#d64545;font-size:.85rem;margin-bottom:12px;}
</style></head><body>
  <form class="card" method="POST">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1>Purewash Staff</h1>
    <p class="sub">Enter your staff password</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus>
    <button type="submit">Sign In</button>
  </form>
</body></html>
