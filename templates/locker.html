<!--
  Purewash Smart Locker — customer drop-off page
  ------------------------------------------------
  Self-contained (no build step). Drop into Flask as templates/drop_off.html.
  Configure behaviour in the CONFIG block near the bottom of this file.
-->
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#0e3140" name="theme-color"/>
<title>Purewash — Smart Locker Drop-off</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --teal:        #0e8f83;
    --teal-deep:   #0a6f6c;
    --teal-bright: #12a594;
    --navy:        #163455;   /* headings */
    --navy-deep:   #0e3140;   /* footer wave */
    --ink:         #3f5566;   /* body text */
    --muted:       #6d8494;
    --line:        #e6eef1;
    --card:        #ffffff;
    --bg-top:      #f2f8fb;
    --bg-mid:      #dbe9ef;
    --radius:      26px;
    --shadow:      0 30px 70px -30px rgba(14,49,64,.35);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    font-family:'Poppins', system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 12% -5%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(1100px 700px at 90% 10%, #eaf5f8 0%, rgba(234,245,248,0) 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 62%, #cbdee6 100%);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* soft floating bubbles */
  .bubble{ position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.9), rgba(255,255,255,.05) 60%);
    border:1px solid rgba(255,255,255,.55); }
  .bubble.b1{ width:80px; height:80px; top:6%;  left:34%; }
  .bubble.b2{ width:46px; height:46px; top:11%; left:60%; }
  .bubble.b3{ width:120px;height:120px;top:74%; left:8%;  opacity:.5; }
  .bubble.b4{ width:34px; height:34px; top:82%; left:44%; opacity:.6; }
  .bubble.b5{ width:60px; height:60px; top:20%; left:5%;  opacity:.5; }

  /* footer wave */
  .wave{ position:fixed; left:0; right:0; bottom:0; height:34vh; min-height:230px; z-index:0;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    clip-path:polygon(0 22%, 12% 15%, 28% 20%, 44% 12%, 60% 18%, 76% 10%, 90% 16%, 100% 11%, 100% 100%, 0 100%); }

  .page{ position:relative; z-index:2; max-width:1240px; margin:0 auto; padding:34px 22px 40px; }

  /* ---------- brand bar ---------- */
  .brandbar{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .logo{ width:52px; height:52px; border-radius:15px; flex:none;
    background:linear-gradient(150deg,#ffffff,#eef7f7);
    box-shadow:0 8px 20px -8px rgba(14,143,131,.5), inset 0 0 0 1px rgba(14,143,131,.08);
    display:grid; place-items:center; }
  .logo svg{ width:30px; height:30px; }
  .brand-name{ line-height:1; }
  .brand-name .b1{ font-weight:800; letter-spacing:.14em; font-size:1.35rem; color:var(--navy); }
  .brand-name .b2{ font-weight:500; letter-spacing:.42em; font-size:.6rem; color:var(--teal); margin-top:4px; }

  /* ---------- grid ---------- */
  .grid{ display:grid; gap:30px; grid-template-columns:1fr; }
  .col-copy{ grid-area:copy; }
  .col-card{ grid-area:card; }
  .col-features{ grid-area:features; }
  .col-locker{ grid-area:locker; display:none; }
  .grid{ grid-template-areas:"copy" "card" "features"; }

  /* ---------- hero copy ---------- */
  .col-copy h1{ font-size:clamp(2.3rem,5vw,3.3rem); line-height:1.05; font-weight:800; color:var(--navy); letter-spacing:-.02em; }
  .col-copy h1 .accent{ color:var(--teal-bright); display:block; }
  .col-copy .lede{ margin-top:18px; font-size:1.08rem; color:var(--ink); max-width:34ch; }

  /* features */
  .features{ margin-top:30px; display:flex; flex-direction:column; gap:20px; }
  .feature{ display:flex; gap:15px; align-items:flex-start; }
  .feature .fi{ width:46px; height:46px; border-radius:14px; flex:none; display:grid; place-items:center;
    background:linear-gradient(150deg,#ffffff,#e9f4f4);
    box-shadow:0 10px 24px -14px rgba(14,49,64,.4), inset 0 0 0 1px rgba(14,143,131,.1);
    color:var(--teal-deep); }
  .feature .fi svg{ width:22px; height:22px; }
  .feature h3{ font-size:.98rem; color:var(--navy); font-weight:600; }
  .feature p{ font-size:.85rem; color:var(--muted); margin-top:2px; line-height:1.4; }

  /* whatsapp help */
  .wa-help{ margin-top:28px; display:flex; align-items:center; gap:14px; background:#fff;
    border:1px solid var(--line); border-radius:18px; padding:14px 18px; max-width:340px;
    box-shadow:0 16px 40px -26px rgba(14,49,64,.5); }
  .wa-help .wa-ic{ width:42px; height:42px; border-radius:50%; background:#25d366; color:#fff; display:grid; place-items:center; flex:none; }
  .wa-help .wa-ic svg{ width:24px; height:24px; }
  .wa-help .wa-t small{ display:block; font-size:.72rem; color:var(--muted); }
  .wa-help .wa-t b{ font-size:.86rem; color:var(--ink); font-weight:500; }
  .wa-help a{ display:block; color:var(--teal-deep); font-weight:700; font-size:1rem; text-decoration:none; margin-top:2px; }

  /* ---------- the card ---------- */
  .card{ background:var(--card); border-radius:var(--radius); padding:34px 34px 30px;
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.7); position:relative; }
  .card-logo{ width:66px; height:66px; border-radius:20px; margin:0 auto -6px; display:grid; place-items:center;
    background:linear-gradient(150deg,#ffffff,#eaf6f5);
    box-shadow:0 14px 30px -14px rgba(14,143,131,.55), inset 0 0 0 1px rgba(14,143,131,.1); transform:translateY(-42px); }
  .card-logo svg{ width:38px; height:38px; }
  .card-head{ text-align:center; margin-top:-30px; }
  .card-head h2{ font-size:1.65rem; font-weight:700; color:var(--navy); letter-spacing:-.01em; }
  .card-head h2 span{ color:var(--teal-bright); }
  .div-lock{ display:flex; align-items:center; gap:12px; margin:16px auto 12px; max-width:220px; color:var(--muted); }
  .div-lock::before,.div-lock::after{ content:""; height:1px; flex:1; background:var(--line); }
  .div-lock svg{ width:16px; height:16px; }
  .card-sub{ text-align:center; font-size:.9rem; color:var(--muted); line-height:1.5; }
  .card-sub b{ color:var(--ink); font-weight:600; }

  /* form */
  form{ margin-top:24px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:.85rem; font-weight:600; color:var(--navy); margin-bottom:8px; }
  .input{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:14px;
    padding:0 14px; background:#fbfdfe; transition:border-color .15s, box-shadow .15s; }
  .input:focus-within{ border-color:var(--teal-bright); box-shadow:0 0 0 4px rgba(18,165,148,.12); background:#fff; }
  .input svg{ width:20px; height:20px; color:var(--muted); flex:none; }
  .input input{ border:none; outline:none; background:transparent; width:100%; padding:15px 0; font:inherit; font-size:1rem; color:var(--navy); }
  .input input::placeholder{ color:#a8b8c2; }
  .prefix{ font-size:1rem; color:var(--ink); font-weight:500; }
  .err{ display:none; color:#d64545; font-size:.78rem; margin-top:6px; }
  .field.invalid .input{ border-color:#e69090; box-shadow:0 0 0 4px rgba(214,69,69,.1); }
  .field.invalid .err{ display:block; }

  /* button */
  .btn{ width:100%; border:none; cursor:pointer; border-radius:16px; padding:6px; margin-top:6px;
    background:linear-gradient(135deg,#0c7c78 0%, #10a08e 100%);
    box-shadow:0 18px 34px -16px rgba(12,124,120,.9); position:relative;
    display:flex; align-items:center; justify-content:center; gap:0; overflow:hidden; transition:transform .12s, box-shadow .2s; }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 22px 40px -16px rgba(12,124,120,1); }
  .btn:active{ transform:translateY(0); }
  .btn:disabled{ opacity:.75; cursor:default; transform:none; }
  .btn .lockring{ width:46px; height:46px; border-radius:12px; background:rgba(255,255,255,.14); display:grid; place-items:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), 0 0 18px rgba(120,255,235,.35); margin-left:6px; flex:none; }
  .btn .lockring svg{ width:22px; height:22px; color:#eafffb; }
  .btn .label{ flex:1; color:#fff; font-weight:700; font-size:1.12rem; text-align:center; padding:16px 0; }
  .btn .arrow svg{ width:22px; height:22px; color:#fff; margin-right:16px; }
  .btn .spinner{ display:none; width:22px; height:22px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; margin-right:16px; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .secure{ display:flex; align-items:center; justify-content:center; gap:7px; margin-top:14px; font-size:.82rem; color:var(--muted); }
  .secure svg{ width:16px; height:16px; color:var(--teal); }

  /* steps */
  .steps{ margin-top:24px; padding-top:22px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .step{ text-align:center; }
  .step .num{ width:26px; height:26px; border-radius:50%; border:1.5px solid var(--teal); color:var(--teal-deep);
    font-size:.78rem; font-weight:700; display:grid; place-items:center; margin:0 auto 8px; }
  .step .sic{ color:var(--navy); margin-bottom:8px; }
  .step .sic svg{ width:24px; height:24px; }
  .step h4{ font-size:.84rem; color:var(--navy); font-weight:600; }
  .step p{ font-size:.74rem; color:var(--muted); margin-top:3px; line-height:1.35; }

  /* success state */
  .success{ display:none; text-align:center; padding:14px 4px 6px; }
  .success .tick{ width:76px; height:76px; border-radius:50%; margin:0 auto 18px; display:grid; place-items:center;
    background:linear-gradient(135deg,#0c7c78,#10a08e); box-shadow:0 16px 34px -14px rgba(12,124,120,.9); }
  .success .tick svg{ width:38px; height:38px; color:#fff; }
  .success h2{ font-size:1.5rem; color:var(--navy); font-weight:700; }
  .success p{ margin-top:10px; color:var(--ink); font-size:.98rem; line-height:1.5; }
  .success .again{ margin-top:20px; background:none; border:1.5px solid var(--line); border-radius:12px;
    padding:11px 22px; font:inherit; font-weight:600; color:var(--teal-deep); cursor:pointer; }
  .card.done form,.card.done .steps,.card.done .div-lock,.card.done .card-sub{ display:none; }
  .card.done .success{ display:block; }

  /* ---------- decorative locker ---------- */
  .locker{ position:relative; height:100%; min-height:420px; border-radius:24px; overflow:hidden;
    background:linear-gradient(160deg,#2b4a56,#14313c);
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.06); }
  .locker .tag{ position:absolute; top:18px; right:18px; color:#dff5f2; font-weight:700; letter-spacing:.18em; font-size:.8rem;
    text-shadow:0 0 14px rgba(120,255,235,.6); }
  .locker .door{ position:absolute; inset:54px 20px 20px; border-radius:16px; border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,0)); }
  .locker .glow{ position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); width:72px; height:82px; border-radius:14px;
    display:grid; place-items:center; border:1.5px solid rgba(120,255,235,.7); box-shadow:0 0 26px rgba(120,255,235,.55), inset 0 0 18px rgba(120,255,235,.3); }
  .locker .glow svg{ width:34px; height:34px; color:#c9fff5; filter:drop-shadow(0 0 6px rgba(120,255,235,.8)); }
  .locker .seam{ position:absolute; left:20px; right:20px; height:1px; background:rgba(255,255,255,.06); }
  .locker .seam.s1{ bottom:33%; } .locker .seam.s2{ bottom:0; display:none; }

  /* ---------- trust strip ---------- */
  .trust{ position:relative; z-index:2; margin:44px 0 26px; display:grid; grid-template-columns:repeat(4,1fr); gap:22px; color:#eaf5f5; }
  .trust .t{ display:flex; align-items:flex-start; gap:12px; }
  .trust .t + .t{ position:relative; }
  .trust .t + .t::before{ content:""; position:absolute; left:-11px; top:2px; bottom:2px; width:1px; background:rgba(255,255,255,.14); }
  .trust .t svg{ width:26px; height:26px; color:#8fd8cf; flex:none; margin-top:2px; }
  .trust .t b{ display:block; font-size:.92rem; font-weight:600; }
  .trust .t small{ font-size:.78rem; color:#b7cdd0; }

  footer{ position:relative; z-index:2; text-align:center; padding-bottom:16px; }
  footer .thanks{ color:#dceceb; font-size:.95rem; }
  footer .script{ font-family:'Dancing Script',cursive; font-size:1.7rem; color:#5fd6c6; margin-top:4px; }

  /* ---------- responsive ---------- */
  @media (min-width:760px){
    .grid{ grid-template-columns:1fr 1.12fr; grid-template-areas:"copy card" "features card"; align-items:start; }
    .col-copy .lede{ max-width:30ch; }
  }
  @media (min-width:1120px){
    .grid{ grid-template-columns:1fr 1.1fr .62fr; grid-template-areas:"copy card locker" "features card locker"; }
    .col-locker{ display:block; }
  }
  @media (max-width:560px){
    .page{ padding:22px 16px 30px; }
    .card{ padding:26px 20px 24px; }
    .trust{ grid-template-columns:1fr 1fr; gap:18px 22px; }
    .steps{ gap:6px; }
    .step p{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
</head>
<body><div class="page"><div style="padding:24px;background:white;border-radius:24px;box-shadow:var(--shadow);max-width:900px;margin:40px auto;">
<h1>Purewash Laundry</h1>
<div class="sub">Smart Locker · {{ locker_id }}</div>
<!-- STEP 1: name + phone -->
<div class="card" id="step-details">
<label>Your Name</label>
<input autocomplete="name" id="name" placeholder="Enter your name" type="text"/>
<label>Phone Number</label>
<input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" type="tel"/>
<button class="btn" onclick="goToChoice()">Continue</button>
<div id="err1"></div>
</div>
<!-- STEP 2: pickup or drop-off -->
<div class="card hidden" id="step-choice">
<label>What would you like to do?</label>
<div class="choice">
<button class="btn" id="btn-dropoff" onclick="chooseAction('DROPOFF')">Drop Off</button>
<button class="btn" id="btn-pickup" onclick="chooseAction('PICKUP')">Pick Up</button>
</div>
<button class="back" onclick="showStep('step-details')">← Back</button>
</div>
<!-- STEP 3: compartment grid -->
<div class="card hidden" id="step-grid">
<label id="grid-label">Select an available compartment</label>
<div class="grid" id="grid"></div>
<button class="btn" id="btn-open" onclick="openSelected()" style="margin-top:16px;">Open Compartment</button>
<button class="back" onclick="showStep('step-choice')">← Back</button>
<div id="err3"></div>
</div>
<!-- STEP 4: result -->
<div class="card hidden" id="step-done">
<div class="msg ok" id="done-msg"></div>
<button class="btn" onclick="location.reload()" style="margin-top:16px;">Done</button>
</div>
<script>
const LOCKER_ID = "{{ locker_id }}";
let state = { name: "", phone: "", action: "", compartment: null };

function showStep(id) {
  ["step-details","step-choice","step-grid","step-done"].forEach(s => {
    document.getElementById(s).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function goToChoice() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const err = document.getElementById("err1");
  if (!name) { err.innerHTML = '<div class="msg err">Please enter your name.</div>'; return; }
  if (!/^\d{10}$/.test(phone)) { err.innerHTML = '<div class="msg err">Enter a valid 10-digit phone.</div>'; return; }
  err.innerHTML = "";
  state.name = name;
  state.phone = phone;
  showStep("step-choice");
}

async function chooseAction(action) {
  state.action = action;
  document.getElementById("btn-dropoff").classList.toggle("active", action === "DROPOFF");
  document.getElementById("btn-pickup").classList.toggle("active", action === "PICKUP");

  if (action === "PICKUP") {
    // Find their compartment by phone
    const r = await fetch(`/api/my-compartment?locker_id=${LOCKER_ID}&phone=${state.phone}`);
    const data = await r.json();
    if (!data.found) {
      document.getElementById("err3").innerHTML = '';
      showStep("step-grid");
      document.getElementById("grid").innerHTML =
        '<div class="msg err" style="grid-column:1/3;">No laundry found for this number. Check the phone number, or choose Drop Off.</div>';
      document.getElementById("btn-open").classList.add("hidden");
      document.getElementById("grid-label").textContent = "Pickup";
      return;
    }
    // Auto-select their compartment
    state.compartment = data.compartment;
    document.getElementById("grid-label").textContent = "Your laundry is in this compartment:";
    document.getElementById("btn-open").classList.remove("hidden");
    renderGrid([{ compartment: data.compartment, occupied: true }], true);
    showStep("step-grid");
  } else {
    // DROP-OFF: show all, only empties selectable
    await loadGrid();
    document.getElementById("grid-label").textContent = "Select an available compartment";
    document.getElementById("btn-open").classList.remove("hidden");
    showStep("step-grid");
  }
}

async function loadGrid() {
  const r = await fetch(`/api/availability?locker_id=${LOCKER_ID}`);
  const comps = await r.json();
  renderGrid(comps, false);
}

function renderGrid(comps, isPickup) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  state.compartment = isPickup ? state.compartment : null;
  comps.forEach(c => {
    const div = document.createElement("div");
    div.className = "comp " + (c.occupied ? "occupied" : "empty");
    if (isPickup) div.className = "comp selected";
    div.innerHTML = `<span class="num">${c.compartment}</span>` +
                    (isPickup ? "Yours" : (c.occupied ? "In use" : "Available"));
    if (!isPickup && !c.occupied) {
      div.onclick = () => {
        document.querySelectorAll(".comp").forEach(x => x.classList.remove("selected"));
        div.classList.add("selected");
        state.compartment = c.compartment;
      };
    }
    grid.appendChild(div);
  });
}

async function openSelected() {
  const err = document.getElementById("err3");
  if (!state.compartment) {
    err.innerHTML = '<div class="msg err">Please select a compartment.</div>';
    return;
  }
  err.innerHTML = "";
  const r = await fetch("/api/open", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      locker_id: LOCKER_ID,
      name: state.name,
      phone: state.phone,
      action: state.action,
      compartment: state.compartment
    })
  });
  const data = await r.json();
  if (!data.ok) {
    err.innerHTML = `<div class="msg err">${data.error || "Something went wrong."}</div>`;
    return;
  }
  document.getElementById("done-msg").textContent =
    `Compartment ${data.compartment} is opening. Please ${state.action === "PICKUP" ? "collect your laundry" : "place your laundry inside"} and close the door.`;
  showStep("step-done");
}
</script>

  state.compartment = isPickup ? state.compartment : null;
  comps.forEach(c => {
    const div = document.createElement("div");
    div.className = "comp " + (c.occupied ? "occupied" : "empty");
    if (isPickup) div.className = "comp selected";
    div.innerHTML = `<span class="num">${c.compartment}</span>` +
                    (isPickup ? "Yours" : (c.occupied ? "In use" : "Available"));
    if (!isPickup && !c.occupied) {
      div.onclick = () => {
        document.querySelectorAll(".comp").forEach(x => x.classList.remove("selected"));
        div.classList.add("selected");
        state.compartment = c.compartment;
      };
    }
    grid.appendChild(div);
  });
}

async function openSelected() {
  const err = document.getElementById("err3");
  if (!state.compartment) {
    err.innerHTML = '<div class="msg err">Please select a compartment.</div>';
    return;
  }
  err.innerHTML = "";
  const r = await fetch("/api/open", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      locker_id: LOCKER_ID,
      name: state.name,
      phone: state.phone,
      action: state.action,
      compartment: state.compartment
    })
  });
  const data = await r.json();
  if (!data.ok) {
    err.innerHTML = `<div class="msg err">${data.error || "Something went wrong."}</div>`;
    return;
  }
  document.getElementById("done-msg").textContent =
    `Compartment ${data.compartment} is opening. Please ${state.action === "PICKUP" ? "collect your laundry" : "place your laundry inside"} and close the door.`;
  showStep("step-done");
}
</script></body>
